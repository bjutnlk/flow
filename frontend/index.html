<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>前端示例页面</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #e2e8f0;
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(135deg, #020617, var(--bg));
      color: var(--text);
      padding: 24px;
    }

    .card {
      width: min(560px, 100%);
      background: rgba(30, 41, 59, 0.9);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    p {
      margin: 0 0 20px;
      color: #cbd5e1;
    }

    .row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 10px 16px;
      font-size: 15px;
      cursor: pointer;
      background: var(--accent);
      color: #082f49;
      font-weight: 700;
      transition: transform 120ms ease, background 120ms ease;
    }

    button:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
    }

    .counter {
      margin-top: 18px;
      font-size: 18px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>你好，前端 👋</h1>
    <p>这是一个纯 HTML/CSS/JS 的示例页面，点击按钮可以更新计数。</p>

    <div class="row">
      <button id="addBtn">+1</button>
      <button id="resetBtn">重置</button>
    </div>

    <div class="counter">当前计数：<span id="count">0</span></div>
  </main>

  <script>
    const countEl = document.getElementById("count");
    const addBtn = document.getElementById("addBtn");
    const resetBtn = document.getElementById("resetBtn");

    let count = 0;

    function render() {
      countEl.textContent = String(count);
    }

    addBtn.addEventListener("click", () => {
      count += 1;
      render();
    });

    resetBtn.addEventListener("click", () => {
      count = 0;
      render();
    });
  </script>
</body>
</html>
